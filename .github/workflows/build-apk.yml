name: Debug-APK bauen

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: APK bauen
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest assembleDebug 2>&1 | tee build.log

      - name: Testergebnis melden
        if: always()
        run: |
          r=$(grep -ho '<testsuite [^>]*' app/build/test-results/testDebugUnitTest/*.xml 2>/dev/null | sed -E 's/.*name="([^"]*)".*tests="([0-9]+)".*failures="([0-9]+)".*errors="([0-9]+)".*/\1: \2 Tests, \3 Fehlschlaege, \4 Fehler/' | tr '\n' ' ')
          echo "::notice title=Tests::${r:-keine Testergebnisse}"

      - name: Fehler melden
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Could not|> |FAILED|Exception|expected" build.log | head -60 > errors.txt || true
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' errors.txt)
          echo "::error title=Build-Fehler::${msg}"

      - uses: actions/upload-artifact@v4
        with:
          name: FA-Mail-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: APK als Download veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/*.apk FA-Mail-debug.apk
          gh release delete test-apk --yes --cleanup-tag || true
          gh release create test-apk FA-Mail-debug.apk --title "FA Mail – Test-APK" --notes "Automatisch gebaut aus ${GITHUB_SHA::7}" --prerelease
